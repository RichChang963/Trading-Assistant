[project]
name = "trading-assistant"
version = "0.1.0"
description = "Multi-agent trading assistant"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.3.1",
    "plotly==6.3.0",
    "python-dotenv==1.2.1",
    "requests==2.32.5",
    "rich==14.2.0",
    "pydantic==2.12.5",
    "pyyaml>=6.0",
    "langchain==1.2.10",
    "langchain-openai==1.1.7",
    "langchain-anthropic==1.3.1",
    "langchain-google-genai==4.2.0",
    "langchain-ollama==1.0.1",
    "langgraph>=1.0.8",
    "langgraph-prebuilt<1.0.9",
    "langchain-community==0.4.1",
    "openbb==4.6.0",
    "yfinance>=0.2.28",
    "pycountry>=24.6.1",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg-pool>=3.3.3",
    "fastembed>=0.9.1",
    "fastapi>=0.128.8",
    "uvicorn[standard]>=0.40.0",
]

[dependency-groups]
dev = ["ipykernel==6.30.0"]

[tool.uv]
required-version = ">=0.13.4"
